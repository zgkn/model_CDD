name: Fire Susceptibility Pipeline

on:
  schedule:
    # ECMWF publishes the 00Z / 12Z runs roughly 7h40m later; run shortly after each.
    - cron: '45 8 * * *'
    - cron: '45 20 * * *'
  push:
    branches: [main]
    paths: ['main.py', 'requirements*.txt', 'tests/**', '.github/workflows/pipeline.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    # Only build and publish the map on schedule / manual runs / pushes to main, never for PRs.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py --out-dir public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: write # lets the keep-alive step below re-enable this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow resets that timer. Best-effort: never fail a good deploy over it.
      - name: Keep scheduled workflow alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
